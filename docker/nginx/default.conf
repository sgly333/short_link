# 静态站点 + 将 /api 反代到 Spring Cloud Gateway（容器名 shortlink-gateway:8000）
# 若 Nginx 跑在宿主机、网关在宿主机 8000 端口：把下面 upstream 改为 server 127.0.0.1:8000;

upstream shortlink_gateway {
    server shortlink-gateway:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location /api/ {
        proxy_pass http://shortlink_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 前端 axios 会带 Token、Username，默认会传给上游
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
